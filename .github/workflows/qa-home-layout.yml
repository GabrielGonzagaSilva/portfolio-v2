name: QA Home against Figma

on:
  workflow_dispatch:
  push:
    branches: [feat/figma-scalable-foundation]

jobs:
  qa-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Install QA browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7 pixelmatch@7
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev > /tmp/portfolio.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/portfolio.log
          exit 1
      - name: Download Figma references
        run: |
          mkdir -p qa-output
          curl -fsSL 'https://www.figma.com/api/mcp/asset/971f75b0-8d13-4c06-b4e8-318bf041edf3.png' -o qa-output/figma-desktop.png
          curl -fsSL 'https://www.figma.com/api/mcp/asset/bce8fc80-9a0e-429f-af2f-9eddd9b94390.png' -o qa-output/figma-tablet.png
          curl -fsSL 'https://www.figma.com/api/mcp/asset/c45d195a-ab05-4e9a-9f0c-b19510dadca3.png' -o qa-output/figma-mobile.png
      - name: Measure and compare
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const { PNG } = require('pngjs');
          const pixelmatch = require('pixelmatch').default || require('pixelmatch');

          (async () => {
            const cases = [
              { name: 'desktop', width: 1440, height: 1724, figma: 'qa-output/figma-desktop.png', expected: {
                page:[0,0,1440,1724], header:[0,0,1440,73], nav:[603,16,234,41], hero:[120,97,1200,381], work:[120,574,1200,954], footer:[120,1624,1200,100],
                cards:[[120,574,580,397],[740,574,580,397],[120,1011,580,397],[740,1011,580,397]], mediaHeight:340, titleHeight:101, roleHeight:16, statementHeight:21
              }},
              { name: 'tablet', width: 834, height: 1298, figma: 'qa-output/figma-tablet.png', expected: {
                page:[0,0,834,1298], header:[0,0,834,73], nav:[300,16,234,41], hero:[40,88,754,320], work:[40,480,754,646], footer:[40,1198,754,100],
                cards:[[40,480,365,271],[429,480,365,271],[40,775,365,271],[429,775,365,271]], mediaHeight:214, titleHeight:67, roleHeight:16, statementHeight:21
              }},
              { name: 'mobile', width: 390, height: 1785, figma: 'qa-output/figma-mobile.png', expected: {
                page:[0,0,390,1785], header:[0,0,390,73], nav:[78,16,234,41], hero:[24,88,342,280], work:[24,432,342,1164], footer:[24,1660,342,125],
                cards:[[24,432,342,257],[24,713,342,257],[24,994,342,257],[24,1275,342,257]], mediaHeight:200, titleHeight:44, roleHeight:16, statementHeight:42
              }}
            ];

            const round = n => Math.round(n * 10) / 10;
            const delta = (a,b) => a.map((v,i)=>round(v-b[i]));
            const browser = await chromium.launch({headless:true});
            let failed = false;
            for (const c of cases) {
              const page = await browser.newPage({ viewport: { width:c.width, height:c.height }, deviceScaleFactor:1 });
              await page.goto('http://127.0.0.1:3000/', {waitUntil:'networkidle'});
              await page.evaluate(() => document.fonts.ready);
              const m = await page.evaluate(() => {
                const r = el => { const x=el.getBoundingClientRect(); return [Math.round(x.x*10)/10,Math.round(x.y*10)/10,Math.round(x.width*10)/10,Math.round(x.height*10)/10]; };
                const cards=[...document.querySelectorAll('#work > *')];
                return {
                  page:r(document.querySelector('main')),
                  header:r(document.querySelector('header')),
                  nav:r(document.querySelector('nav')),
                  hero:r(document.querySelector('section[aria-labelledby="home-title"]')),
                  work:r(document.querySelector('#work')),
                  footer:r(document.querySelector('footer')),
                  cards:cards.map(r),
                  media:cards.map(x=>r(x.firstElementChild)),
                  title:r(document.querySelector('#home-title')),
                  role:r(document.querySelector('#home-title + p')),
                  statement:r(document.querySelector('section[aria-labelledby="home-title"] > p')),
                  bodyScrollHeight:document.documentElement.scrollHeight
                };
              });
              await page.screenshot({path:`qa-output/web-${c.name}.png`, fullPage:true});
              console.log(`\n=== ${c.name.toUpperCase()} ===`);
              for (const k of ['page','header','nav','hero','work','footer']) console.log(k, m[k], 'expected', c.expected[k], 'delta', delta(m[k],c.expected[k]));
              m.cards.forEach((x,i)=>console.log(`card${i+1}`,x,'expected',c.expected.cards[i],'delta',delta(x,c.expected.cards[i])));
              console.log('media heights', m.media.map(x=>x[3]), 'expected', c.expected.mediaHeight);
              console.log('text heights', {title:m.title[3],role:m.role[3],statement:m.statement[3]}, 'expected', {title:c.expected.titleHeight,role:c.expected.roleHeight,statement:c.expected.statementHeight});
              console.log('scrollHeight',m.bodyScrollHeight,'expected',c.height);

              const ref=PNG.sync.read(fs.readFileSync(c.figma));
              const web=PNG.sync.read(fs.readFileSync(`qa-output/web-${c.name}.png`));
              if(ref.width===web.width && ref.height===web.height){
                const diff=new PNG({width:ref.width,height:ref.height});
                const mismatched=pixelmatch(ref.data,web.data,diff.data,ref.width,ref.height,{threshold:0.12});
                fs.writeFileSync(`qa-output/diff-${c.name}.png`,PNG.sync.write(diff));
                const ratio=mismatched/(ref.width*ref.height);
                console.log('pixelMismatchRatio',round(ratio*100)+'%');
              }
              const geomKeys=['page','header','nav','hero','work','footer'];
              for(const k of geomKeys) if(delta(m[k],c.expected[k]).some(v=>Math.abs(v)>1)) failed=true;
              m.cards.forEach((x,i)=>{ if(delta(x,c.expected.cards[i]).some(v=>Math.abs(v)>1)) failed=true; });
              if(Math.abs(m.bodyScrollHeight-c.height)>1) failed=true;
              await page.close();
            }
            await browser.close();
            if(failed){ console.error('\nGeometry QA failed tolerance > 1px'); process.exit(1); }
            console.log('\nGeometry QA passed within 1px tolerance.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-figma-qa
          path: qa-output
