name: QuantoLab asset and visual QA

on:
  push:
    branches:
      - feat/figma-scalable-foundation
    paths:
      - .github/workflows/quantolab-asset-qa.yml

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/figma-scalable-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Version QuantoLab Figma assets
        shell: bash
        run: |
          mkdir -p public/images/projects/quantolab
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/e9ce0913-a34a-44d9-91d5-db09a43126ec.png' -o public/images/projects/quantolab/hero.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/cdb3d4ef-d756-4e2e-aa46-e3c9eeaec95f.png' -o public/images/projects/quantolab/catalog.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/59495283-7963-4a7c-a69e-b4bc5efea76a.png' -o public/images/projects/quantolab/salary-result.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/591ab36d-1af1-485e-8520-9c0f8ebfb8cc.png' -o public/images/projects/quantolab/clt-pj.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/69365da0-8701-49bc-b1e4-7be240f67801.png' -o public/images/projects/quantolab/home.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/a41a5434-69cf-4d45-9278-1f9c075baebd.png' -o public/images/projects/quantolab/salary-input.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/81201708-d592-4474-ba1f-f8b82f4acdf7.png' -o public/images/projects/quantolab/methodology.png
          curl -L --fail --retry 3 'https://www.figma.com/api/mcp/asset/1459541a-22b8-4fc9-b2d3-903841ca7cc2.png' -o public/images/projects/quantolab/mobile-phone.png
          test -s public/images/projects/quantolab/hero.png
          test -s public/images/projects/quantolab/mobile-phone.png

      - name: Build application
        run: npm run build

      - name: Start application
        shell: bash
        run: |
          nohup npm start -- -p 3000 > /tmp/quantolab-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/projects/quantolab >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quantolab-next.log
          exit 1

      - name: Download Figma reference screenshots
        shell: bash
        run: |
          mkdir -p qa-quantolab/figma qa-quantolab/web
          curl -L --fail 'https://www.figma.com/api/mcp/asset/7dfecf1d-40b9-4313-b1d2-4536f693117b.png' -o qa-quantolab/figma/quantolab-1440.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/22a123af-02fa-4493-a74d-ca12d119b476.png' -o qa-quantolab/figma/quantolab-834.png
          curl -L --fail 'https://www.figma.com/api/mcp/asset/8d81d2f2-fcbd-45f5-a9e8-dc8a470288a6.png' -o qa-quantolab/figma/quantolab-390.png

      - name: Capture web screenshots
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const width of [1440, 834, 390]) {
              const context = await browser.newContext({ viewport: { width, height: 900 }, deviceScaleFactor: 1 });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:3000/projects/quantolab', { waitUntil: 'networkidle' });
              await page.evaluate(() => document.fonts.ready);
              await page.screenshot({ path: `qa-quantolab/web/quantolab-${width}.png`, fullPage: true });
              console.log(width, await page.evaluate(() => ({width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight})));
              await context.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          cp /tmp/quantolab-next.log qa-quantolab/server.log

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantolab-visual-qa
          path: qa-quantolab
          if-no-files-found: error
          retention-days: 3

      - name: Commit local QuantoLab assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/projects/quantolab
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore(portfolio): version QuantoLab Figma assets'
          git push origin HEAD:feat/figma-scalable-foundation
