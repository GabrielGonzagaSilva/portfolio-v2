name: RDS asset sync

on:
  push:
    branches:
      - feat/figma-scalable-foundation
    paths:
      - '.github/workflows/rds-assets-sync.yml'

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-scalable-foundation

      - name: Download Roteiro do Sul Figma assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/projects/roteiro-do-sul/case
          base='https://www.figma.com/api/mcp/asset/ff2cc2f2-df6e-44bb-83a2-0e68c402a463'
          curl -L --fail "$base/4b556.png" -o public/images/projects/roteiro-do-sul/case/hero.png
          curl -L --fail "$base/66eba.png" -o public/images/projects/roteiro-do-sul/case/diagram-1.png
          curl -L --fail "$base/73e0e.png" -o public/images/projects/roteiro-do-sul/case/foundations-color.png
          curl -L --fail "$base/0932d.png" -o public/images/projects/roteiro-do-sul/case/foundations-typography.png
          curl -L --fail "$base/de908.png" -o public/images/projects/roteiro-do-sul/case/effects-responsive.png
          curl -L --fail "$base/22f39.png" -o public/images/projects/roteiro-do-sul/case/mobile-core-ui.png
          curl -L --fail "$base/5d8db.png" -o public/images/projects/roteiro-do-sul/case/mobile-content-feedback.png
          curl -L --fail "$base/1dcb0.png" -o public/images/projects/roteiro-do-sul/case/bottom-sheet-states.png
          curl -L --fail "$base/86207.png" -o public/images/projects/roteiro-do-sul/case/mobile-home.png
          curl -L --fail "$base/fdc27.png" -o public/images/projects/roteiro-do-sul/case/mobile-profile.png
          curl -L --fail "$base/c0681.png" -o public/images/projects/roteiro-do-sul/case/mobile-business.png
          curl -L --fail "$base/3a530.png" -o public/images/projects/roteiro-do-sul/case/web-responsive.png
          curl -L --fail "$base/7f388.png" -o public/images/projects/roteiro-do-sul/case/web-home.png
          curl -L --fail "$base/63174.png" -o public/images/projects/roteiro-do-sul/case/web-search.png
          curl -L --fail "$base/d83dc.png" -o public/images/projects/roteiro-do-sul/case/web-business.png
          curl -L --fail "$base/82ea5.png" -o public/images/projects/roteiro-do-sul/case/reusable-states.png
          curl -L --fail "$base/4cbbc.png" -o public/images/projects/roteiro-do-sul/case/state-results.png
          curl -L --fail "$base/b566d.png" -o public/images/projects/roteiro-do-sul/case/state-loading.png
          curl -L --fail "$base/0a714.png" -o public/images/projects/roteiro-do-sul/case/state-no-results.png
          curl -L --fail "$base/8b2b6.png" -o public/images/projects/roteiro-do-sul/case/state-error.png
          curl -L --fail "$base/2a277.png" -o public/images/projects/roteiro-do-sul/case/state-success.png

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/projects/roteiro-do-sul/case
          git diff --cached --quiet && exit 0
          git commit -m 'chore(rds): sync case study assets from Figma'
          git push origin HEAD:feat/figma-scalable-foundation
