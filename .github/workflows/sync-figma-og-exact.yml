name: Sync exact Figma OG export

on:
  push:
    branches: [fix/figma-og-exact]
    paths:
      - '.github/workflows/sync-figma-og-exact.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/figma-og-exact
      - name: Download exact Figma frame export
        run: |
          curl --fail --location --retry 3 \
            --output public/og-home-figma.png \
            'https://www.figma.com/api/mcp/asset/21f169da-407e-4b7a-b679-e9ed101f75d4.png'
      - name: Verify PNG dimensions
        run: |
          python - <<'PY'
          import struct
          p = 'public/og-home-figma.png'
          with open(p, 'rb') as f:
              header = f.read(24)
          assert header[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          width, height = struct.unpack('>II', header[16:24])
          assert (width, height) == (1200, 630), (width, height)
          print(f'validated {width}x{height}')
          PY
      - name: Commit exact export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/og-home-figma.png
          git diff --cached --quiet && exit 0
          git commit -m 'fix(share): use exact Figma social preview export'
          git push origin HEAD:fix/figma-og-exact
